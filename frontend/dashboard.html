<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="w-full h-full bg-slate-400">
  <nav class="h-17 w-full bg-slate-950 flex justify-between items-center px-10 text-xl text-white">
    <div class="text-3xl font-bold w-fit bg-linear-to-r from-blue-500 to-red-100 bg-clip-text text-transparent">
      DashBoard
    </div>

    <div>
      <button class="pb-1 pt-0.5 px-4 rounded-xl cursor-pointer bg-red-500/90 font-semibold" id="logout">Logout</button>
    </div>
  </nav>

  <div class="w-full h-full">

    <div class="welcome text-center text-4xl font-bold text-slate-900 mt-6">Welcome </div>
  </div>
</body>
<script>
  if (!localStorage.getItem("isLoggedIn")) window.location.href = "http://127.0.0.1:5500/WebD/frontend/login.html"
  document.getElementById("logout").addEventListener("click", () => {
    localStorage.removeItem("isLoggedIn");
    window.location.href = "http://127.0.0.1:5500/WebD/frontend/login.html"
  })
  document.querySelector(".welcome").innerHTML = `Welcome Back ${localStorage.getItem("username").slice(0, 1).toUpperCase() + localStorage.getItem("username").slice(1)}`
</script>

</html>
